name: Deploy stable + staging
on:
  workflow_dispatch:
    inputs:
      target:
        description: "Which slot to deploy"
        type: choice
        options: [staging, stable, promote]
        default: staging
      stable_port:
        description: "Stable IRC port"
        default: "6667"
        required: false
      staging_port:
        description: "Staging IRC port"
        default: "6668"
        required: false
      server_name:
        description: "Server name (--name)"
        default: "irc.test"
        required: false

env:
  STABLE_PORT: ${{ inputs.stable_port }}
  STAGING_PORT: ${{ inputs.staging_port }}
  INSTALL_DIR: /opt/irc-serve

jobs:
  build:
    runs-on: [self-hosted, tweak-deploy]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build Release
        run: |
          set -euo pipefail
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel "$(nproc)"
          ls -la build/src/irc-serve
      - name: Smoke test
        run: |
          set -euo pipefail
          ./build/src/irc-serve --help 2>&1 | head -8
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: irc-serve-release
          path: build/src/irc-serve
          if-no-files-found: error

  deploy-staging:
    needs: build
    if: inputs.target == 'staging'
    runs-on: [self-hosted, tweak-deploy]
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: irc-serve-release
          path: /tmp/irc-deploy
      - name: Install staging service
        run: |
          set -euo pipefail
          chmod +x /tmp/irc-deploy/irc-serve
          sudo install -d -o root -g root -m 755 "$INSTALL_DIR"
          sudo install -m 755 /tmp/irc-deploy/irc-serve "$INSTALL_DIR/irc-serve-staging"
          sudo tee /etc/systemd/system/irc-serve-staging.service > /dev/null <<EOF
          [Unit]
          Description=irc-serve staging (:${{ env.STAGING_PORT }})
          After=network-online.target
          Wants=network-online.target
          [Service]
          Type=simple
          ExecStart=$INSTALL_DIR/irc-serve-staging --name ${{ inputs.server_name }} ${{ env.STAGING_PORT }}
          Restart=on-failure
          RestartSec=5
          [Install]
          WantedBy=multi-user.target
          EOF
          sudo systemctl daemon-reload
          sudo systemctl enable --now irc-serve-staging
          sleep 3
          if (exec 3<>/dev/tcp/127.0.0.1/${{ env.STAGING_PORT }}) 2>/dev/null; then
            echo "STAGING listening on port ${{ env.STAGING_PORT }}"
            sudo journalctl -u irc-serve-staging --no-pager -n 20
          else
            echo "staging server did not come up:"
            sudo journalctl -u irc-serve-staging --no-pager -n 40
            exit 1
          fi

  deploy-stable:
    needs: build
    if: inputs.target == 'stable'
    runs-on: [self-hosted, tweak-deploy]
    timeout-minutes: 5
    environment:
      name: stable
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: irc-serve-release
          path: /tmp/irc-deploy
      - name: Install stable service
        run: |
          set -euo pipefail
          chmod +x /tmp/irc-deploy/irc-serve
          sudo install -d -o root -g root -m 755 "$INSTALL_DIR"
          sudo install -m 755 /tmp/irc-deploy/irc-serve "$INSTALL_DIR/irc-serve-stable"
          sudo tee /etc/systemd/system/irc-serve-stable.service > /dev/null <<EOF
          [Unit]
          Description=irc-serve stable (:${{ env.STABLE_PORT }})
          After=network-online.target
          Wants=network-online.target
          [Service]
          Type=simple
          ExecStart=$INSTALL_DIR/irc-serve-stable --name ${{ inputs.server_name }} ${{ env.STABLE_PORT }}
          Restart=on-failure
          RestartSec=5
          [Install]
          WantedBy=multi-user.target
          EOF
          sudo systemctl daemon-reload
          sudo systemctl enable --now irc-serve-stable
          sleep 3
          if (exec 3<>/dev/tcp/127.0.0.1/${{ env.STABLE_PORT }}) 2>/dev/null; then
            echo "STABLE listening on port ${{ env.STABLE_PORT }}"
            sudo journalctl -u irc-serve-stable --no-pager -n 20
          else
            echo "stable server did not come up:"
            sudo journalctl -u irc-serve-stable --no-pager -n 40
            exit 1
          fi

  promote:
    needs: build
    if: inputs.target == 'promote'
    runs-on: [self-hosted, tweak-deploy]
    timeout-minutes: 5
    environment:
      name: stable
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: irc-serve-release
          path: /tmp/irc-deploy
      - name: Swap staging-verified binary into stable
        run: |
          set -euo pipefail
          chmod +x /tmp/irc-deploy/irc-serve
          if ! (exec 3<>/dev/tcp/127.0.0.1/${{ env.STAGING_PORT }}) 2>/dev/null; then
            echo "staging is not up on ${{ env.STAGING_PORT }} -- deploy it first"
            exit 1
          fi
          sudo install -d -o root -g root -m 755 "$INSTALL_DIR"
          sudo install -m 755 /tmp/irc-deploy/irc-serve "$INSTALL_DIR/irc-serve-stable"
          sudo systemctl restart irc-serve-stable
          sleep 3
          if (exec 3<>/dev/tcp/127.0.0.1/${{ env.STABLE_PORT }}) 2>/dev/null; then
            echo "PROMOTED to stable on port ${{ env.STABLE_PORT }}"
            sudo journalctl -u irc-serve-stable --no-pager -n 20
          else
            echo "promoted server did not come up:"
            sudo journalctl -u irc-serve-stable --no-pager -n 40
            exit 1
          fi
