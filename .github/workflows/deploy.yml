name: Deploy stable + staging
on:
  workflow_dispatch:
    inputs:
      target:
        description: "Which slot to deploy"
        type: choice
        options: [staging, stable, promote, fed-staging]
        default: staging
      stable_port:
        description: "Stable IRC port"
        default: "6667"
        required: false
      staging_port:
        description: "Staging IRC port"
        default: "6668"
        required: false
      server_name:
        description: "Server name (--name)"
        default: "irc.test"
        required: false

env:
  STABLE_PORT: ${{ inputs.stable_port }}
  STAGING_PORT: ${{ inputs.staging_port }}
  INSTALL_DIR: /opt/irc-serve

jobs:
  build:
    runs-on: [self-hosted, tweak-deploy]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build Release
        run: |
          set -euo pipefail
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel "$(nproc)"
          ls -la build/src/irc-serve
      - name: Smoke test
        run: |
          set -euo pipefail
          ./build/src/irc-serve --help 2>&1 | head -8
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: irc-serve-release
          path: build/src/irc-serve
          if-no-files-found: error

  deploy-staging:
    needs: build
    if: inputs.target == 'staging'
    runs-on: [self-hosted, tweak-deploy]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: irc-serve-release
          path: /tmp/irc-deploy
      - name: Install staging service
        run: |
          set -euo pipefail
          chmod +x /tmp/irc-deploy/irc-serve
          sudo install -d -o root -g root -m 755 "$INSTALL_DIR"
          sudo install -m 755 /tmp/irc-deploy/irc-serve "$INSTALL_DIR/irc-serve-staging"
          # restart, not enable --now: --now never restarts running units, so
          # redeploys kept serving the stale binary (#610). restart also starts
          # an inactive unit, and the unit is already enabled at boot by the
          # hand-install (DEPLOY.md step 0) — no enable call needed, and bare
          # `enable` is not in the sudoers allowlist.
          sudo systemctl restart irc-serve-staging
          sleep 3
          # Protocol-level, not a bare connect: a wedged binary that still
          # listens must fail (#531).
          ./scripts/irc-health-check.sh 127.0.0.1 "${{ env.STAGING_PORT }}"
          sudo journalctl -u irc-serve-staging --no-pager -n 20

  deploy-stable:
    needs: build
    if: inputs.target == 'stable'
    runs-on: [self-hosted, tweak-deploy]
    timeout-minutes: 5
    environment:
      name: stable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: irc-serve-release
          path: /tmp/irc-deploy
      - name: Install stable service
        run: |
          set -euo pipefail
          chmod +x /tmp/irc-deploy/irc-serve
          sudo install -d -o root -g root -m 755 "$INSTALL_DIR"
          sudo install -m 755 /tmp/irc-deploy/irc-serve "$INSTALL_DIR/irc-serve-stable"
          # restart (not enable --now): see staging above (#610). No bare
          # `enable`: not in the sudoers allowlist, and the hand-install
          # already enabled the unit.
          sudo systemctl restart irc-serve-stable
          sleep 3
          # Protocol-level, not a bare connect: a wedged binary that still
          # listens must fail (#531).
          ./scripts/irc-health-check.sh 127.0.0.1 "${{ env.STABLE_PORT }}"
          sudo journalctl -u irc-serve-stable --no-pager -n 20

  promote:
    needs: build
    if: inputs.target == 'promote'
    runs-on: [self-hosted, tweak-deploy]
    timeout-minutes: 5
    environment:
      name: stable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: irc-serve-release
          path: /tmp/irc-deploy
      - name: Swap staging-verified binary into stable
        run: |
          set -euo pipefail
          chmod +x /tmp/irc-deploy/irc-serve
          ./scripts/irc-health-check.sh 127.0.0.1 "${{ env.STAGING_PORT }}" \
            || { echo "staging is not up on ${{ env.STAGING_PORT }} -- deploy it first"; exit 1; }
          sudo install -d -o root -g root -m 755 "$INSTALL_DIR"
          sudo install -m 755 /tmp/irc-deploy/irc-serve "$INSTALL_DIR/irc-serve-stable"
          sudo systemctl restart irc-serve-stable
          sleep 3
          # Protocol-level, not a bare connect: a wedged binary that still
          # listens must fail (#531).
          ./scripts/irc-health-check.sh 127.0.0.1 "${{ env.STABLE_PORT }}"
          echo "PROMOTED to stable on port ${{ env.STABLE_PORT }}"
          sudo journalctl -u irc-serve-stable --no-pager -n 20

  fed-staging:
    needs: build
    if: inputs.target == 'fed-staging'
    runs-on: [self-hosted, tweak-deploy]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: irc-serve-release
          path: /tmp/irc-deploy
      - name: Install federated pair (irc.a:6668 + irc.b:6669)
        run: |
          set -euo pipefail
          chmod +x /tmp/irc-deploy/irc-serve
          sudo install -d -o root -g root -m 755 "$INSTALL_DIR"
          sudo install -m 755 /tmp/irc-deploy/irc-serve "$INSTALL_DIR/irc-serve-fed-a"
          sudo install -m 755 /tmp/irc-deploy/irc-serve "$INSTALL_DIR/irc-serve-fed-b"
          # DIRECTION PREFLIGHT: exactly one side may declare --peer. Both
          # dialling wedges the pair into mutual NAME_IN_USE with no link
          # (usage spec: one-direction dialing). The reference units encode
          # A-dials/B-accepts; fail here — before touching anything — if the
          # live units drifted, rather than deploying onto a wedge.
          # Reads the unit FILES (world-readable), not `systemctl show`:
          # `show` is not in the sudoers allowlist and fails the job.
          peers_a=$(grep -o -- '--peer ' /etc/systemd/system/irc-serve-fed-a.service | wc -l || true)
          peers_b=$(grep -o -- '--peer ' /etc/systemd/system/irc-serve-fed-b.service | wc -l || true)
          [ "$((peers_a + peers_b))" = 1 ] || { echo "dial direction broken: fed-a declares $peers_a --peer, fed-b declares $peers_b (want exactly 1 total). Fix the unit files by hand (DEPLOY.md step 0)."; exit 1; }
          # ORDERED restart, acceptor first: B must be listening before A
          # dials, or A's first attempt hits a closed port and burns retry
          # budget. (A simultaneous restart usually still converges via
          # redial, but the order is free and removes the race.)
          # restart, not enable --now: --now never restarts running units, so
          # redeploys kept serving the stale binary (#610). No bare `enable`:
          # not in the sudoers allowlist, and the hand-install already
          # enabled both units.
          RESTART_TS=$(date +%s)
          sudo systemctl restart irc-serve-fed-b
          ./scripts/irc-health-check.sh 127.0.0.1 6669
          sudo systemctl restart irc-serve-fed-a
          # Protocol-level per node, not bare connects (#531).
          for port in 6668 6669; do
            ./scripts/irc-health-check.sh 127.0.0.1 "$port"
          done
          # Fail unless BOTH links re-establish after the restart: proves the
          # running processes are the just-installed binary, not stale PIDs.
          ok_a=0; ok_b=0
          for i in $(seq 1 12); do
            sudo journalctl -u irc-serve-fed-a --no-pager --since "@$RESTART_TS" | grep -q "link_established" && ok_a=1 || true
            sudo journalctl -u irc-serve-fed-b --no-pager --since "@$RESTART_TS" | grep -q "link_established" && ok_b=1 || true
            if [ "$ok_a" = 1 ] && [ "$ok_b" = 1 ]; then break; fi
            sleep 5
          done
          echo "--- link status A (since restart) ---"
          sudo journalctl -u irc-serve-fed-a --no-pager --since "@$RESTART_TS" | grep -E "link_established|link_rejected|FEDERATE" | tail -5 || true
          echo "--- link status B (since restart) ---"
          sudo journalctl -u irc-serve-fed-b --no-pager --since "@$RESTART_TS" | grep -E "link_established|link_rejected|FEDERATE" | tail -5 || true
          [ "$ok_a" = 1 ] && [ "$ok_b" = 1 ] || { echo "fed link did not re-establish within 60s of restart"; exit 1; }
          # Federation smoke: a channel_join + cross-node PRIVMSG over real
          # sockets. The link being ESTABLISHED proves the handshake; this
          # proves the mesh passes traffic both ways.
          python3 - <<'EOF'
          import socket, time
          def drain(s):
              out = b''
              try:
                  while True:
                      d = s.recv(65536)
                      if not d:
                          break
                      out += d
              except Exception:
                  pass
              return out.decode('utf-8', 'replace')
          def client(nick, port):
              s = socket.create_connection(('127.0.0.1', port), timeout=10)
              s.sendall(f'NICK {nick}\r\nUSER {nick} 0 * :deploy smoke\r\n'.encode())
              time.sleep(1)
              s.settimeout(1)
              drain(s)
              return s
          a = client('depA', 6668)
          b = client('depB', 6669)
          a.sendall(b'JOIN #deploysmoke\r\n')
          time.sleep(1)
          drain(a)
          b.sendall(b'JOIN #deploysmoke\r\n')
          time.sleep(1)
          bj = drain(b)
          assert 'JOIN #DEPLOYSMOKE' in bj, f'B missing own JOIN echo: {bj[:150]!r}'
          assert 'JOIN #DEPLOYSMOKE' in drain(a), 'A missed remote JOIN'
          b.sendall(b'PRIVMSG #deploysmoke :smoke-a\r\n')
          time.sleep(1)
          assert 'smoke-a' in drain(a), 'A missed channel PRIVMSG from B'
          a.sendall(b'PRIVMSG #deploysmoke :smoke-b\r\n')
          time.sleep(1)
          assert 'smoke-b' in drain(b), 'B missed channel PRIVMSG from A'
          a.close()
          b.close()
          print('fed smoke: JOIN echo + bidirectional PRIVMSG ok')
          EOF
