name: Release binaries
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build binaries for (must exist)"
        required: false
        default: ""

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  BUILD_TYPE: Release

jobs:
  build:
    name: build (${{ matrix.asset }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - asset: linux-amd64
            runs_on: [self-hosted, tweak-ci]
          - asset: darwin-arm64
            runs_on: macos-latest
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag != '' && inputs.tag || github.ref }}
      - name: Install OpenSSL dev (Linux, apt systems only)
        if: matrix.asset == 'linux-amd64'
        run: |
          set -euo pipefail
          # Same guard as ci.yml: the self-hosted fleet is Arch (headers
          # preinstalled); only apt images need the install, and sudo -n
          # fails where no NOPASSWD rule exists.
          if command -v apt-get >/dev/null 2>&1; then
            sudo -n apt-get update -qq
            sudo -n apt-get install -y --no-install-recommends libssl-dev
          fi
          openssl version
      - name: Install OpenSSL (macOS only)
        if: matrix.asset == 'darwin-arm64'
        run: |
          set -euo pipefail
          brew install openssl@3 || true
          echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
      - name: Build Release (TLS always on)
        run: |
          set -euo pipefail
          # ONE binary per platform, TLS baked in. Upstream TLS variants are
          # extinct (Caddy/Prometheus/etcd ship one binary); the OFF build
          # survives only as a CI cell proving the zero-dependency claim.
          cmake -S . -B build -DCMAKE_BUILD_TYPE="$BUILD_TYPE" -DWITH_TLS=ON -DBUILD_TESTING=OFF
          cmake --build build --parallel "$(nproc 2>/dev/null || sysctl -n hw.ncpu)"
          ls -la build/src/irc-serve
      - name: Smoke test
        run: |
          set -euo pipefail
          ./build/src/irc-serve --help 2>&1 | head -3
          ./build/src/irc-serve --help 2>&1 | head -1 | grep -q "^irc-serve-" || { echo "binary does not report a version"; exit 1; }
      - name: Assert TLS linked
        run: |
          set -euo pipefail
          if [ "${{ matrix.asset }}" = "darwin-arm64" ]; then
            linked=$(otool -L build/src/irc-serve | grep -cE 'libssl|libcrypto' || true)
          else
            linked=$(ldd build/src/irc-serve | grep -cE 'libssl|libcrypto' || true)
          fi
          [ "$linked" -gt 0 ] || { echo "release binary has no libssl — TLS must be on"; exit 1; }
          echo "linkage OK (ssl_refs=$linked)"
      - name: Package
        run: |
          set -euo pipefail
          ver=$(./build/src/irc-serve --help 2>&1 | head -1 | sed 's/^irc-serve-//')
          [ -n "$ver" ] || { echo "could not read version from binary"; exit 1; }
          # GOOS-GOARCH spellings (linux-amd64, darwin-arm64), dash-separated,
          # no vendor string, no TLS qualifier — the server convention
          # (Caddy/Prometheus/etcd). Prefixed dir with LICENSE/NOTICE/README.
          name="irc-serve-${ver}-${{ matrix.asset }}"
          mkdir -p "dist/$name"
          cp build/src/irc-serve "dist/$name/"
          cp LICENSE NOTICE README.md "dist/$name/" 2>/dev/null || cp LICENSE "dist/$name/"
          (cd dist && tar czf "$name.tar.gz" "$name" && (sha256sum "$name.tar.gz" 2>/dev/null || shasum -a 256 "$name.tar.gz") > "$name.tar.gz.sha256")
          ls -la dist/
          echo "ASSET=$name.tar.gz" >> "$GITHUB_ENV"
          echo "CHECKSUM=$name.tar.gz.sha256" >> "$GITHUB_ENV"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET }}
          path: |
            dist/${{ env.ASSET }}
            dist/${{ env.CHECKSUM }}
          if-no-files-found: error

  publish:
    name: publish to GitHub release
    needs: build
    runs-on: [self-hosted, tweak-ci]
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/rel-assets
          merge-multiple: true
      - name: Aggregate checksums + attest
        run: |
          set -euo pipefail
          cd /tmp/rel-assets
          # ONE SHA256SUMS covering every asset (sha256sum -c compatible),
          # alongside the per-asset sidecars the build cells produced.
          (sha256sum *.tar.gz 2>/dev/null || shasum -a 256 *.tar.gz) > SHA256SUMS
          cat SHA256SUMS
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: /tmp/rel-assets/*.tar.gz
      - name: Attach to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.tag }}" ]; then
            tag="${{ inputs.tag }}"
          else
            tag="${GITHUB_REF#refs/tags/}"
          fi
          ls -la /tmp/rel-assets/
          gh release upload "$tag" /tmp/rel-assets/*.tar.gz /tmp/rel-assets/*.sha256 /tmp/rel-assets/SHA256SUMS --clobber
          echo "Published binaries to release $tag"
          echo "Verify: sha256sum -c SHA256SUMS, then gh attestation verify <file> --owner tweak-wiki"
